<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅の日本語｜每日一段旅行會話</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE5; --paper:#F8F9F5; --ink:#1D2735; --muted:#5C6673; --line:#CBD1C8;
  --shu:#B0412A; --shu-soft:#F1DCD4; --ai:#2B4A75; --ai-soft:#DAE2EC; --wood:#C4A064;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --paper:#1A222D; --ink:#E3E6E0; --muted:#9AA3AE; --line:#2E3946;
    --shu:#E27B60; --shu-soft:#3A2520; --ai:#93B2DB; --ai-soft:#223146; --wood:#A88A56; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1A222D; --ink:#E3E6E0; --muted:#9AA3AE; --line:#2E3946;
  --shu:#E27B60; --shu-soft:#3A2520; --ai:#93B2DB; --ai-soft:#223146; --wood:#A88A56; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7}
.jp{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.wrap{max-width:780px;margin:0 auto;padding:28px 20px 72px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:3px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.top h1{margin:0;font-size:clamp(34px,7vw,48px);line-height:1.1;font-weight:700;letter-spacing:.04em}
.top p{margin:6px 0 0;color:var(--muted);font-size:15px}
.tools{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer}

h2{font-size:21px;margin:44px 0 14px;display:flex;align-items:baseline;gap:10px}
h2 .sub{font-size:14px;font-weight:400;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--paper);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500}
:root[data-theme="dark"] .btn.primary{color:#1a0f0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0f0b}}

/* draw */
.stage{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;margin-top:28px}
.jar{position:relative;width:96px;flex:none;padding-top:60px}
.stick{position:absolute;left:50%;top:64px;width:10px;height:70px;margin-left:-5px;background:var(--wood);border-radius:2px 2px 0 0;z-index:0;opacity:0}
.stick::after{content:"";position:absolute;top:6px;left:2px;right:2px;height:14px;background:var(--shu);border-radius:1px}
.box{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;width:96px;height:180px;border:0;cursor:pointer;
  background:var(--ai);color:var(--paper);border-radius:14px 14px 8px 8px;box-shadow:inset -14px 0 0 rgba(0,0,0,.14)}
.box::before{content:"";position:absolute;top:10px;left:50%;width:22px;height:8px;margin-left:-11px;border-radius:4px;background:rgba(0,0,0,.35)}
.box-label{writing-mode:vertical-rl;font-size:24px;letter-spacing:.25em}
.jar.shaking .box{animation:shake .75s ease-in-out}
.jar.drawn .stick{animation:stickUp .45s ease-out forwards}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
@keyframes stickUp{from{opacity:1;transform:translateY(30px)}to{opacity:1;transform:translateY(-58px)}}

.slip-area{flex:1;min-width:260px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.hint{color:var(--muted);margin:0 0 12px;max-width:26em}
.slip{position:relative;writing-mode:vertical-rl;height:280px;padding:22px 16px;background:var(--paper);border:1px solid var(--line);
  display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 0 var(--line)}
.slip.reveal{animation:unfold .6s ease-out}
@keyframes unfold{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.slip .no{font-size:14px;color:var(--muted);letter-spacing:.15em}
.slip .fortune{font-size:34px;font-weight:700;color:var(--shu);letter-spacing:.1em}
.slip .ttl{font-size:25px;letter-spacing:.08em;line-height:1.9}
.slip .ttl rt{font-size:.42em;color:var(--muted)}
.stamp{position:absolute;writing-mode:horizontal-tb;left:-18px;bottom:-14px;width:58px;height:58px;border:3px solid var(--shu);border-radius:50%;
  color:var(--shu);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;transform:rotate(-12deg);opacity:.9;background:var(--paper)}
.stamp.pop{animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:.9}}
.slip-info{flex:1;min-width:200px;max-width:30em}
.slip-info .emoji{font-size:34px;line-height:1}
.slip-info h3{margin:10px 0 6px;font-size:22px}
.cat-tag{font-size:13px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;vertical-align:middle}
.slip-info p{margin:0;color:var(--muted)}
.draw-actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

/* lesson */
.lesson-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.toggle{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ink)}
.bar-gap{flex:1}
.line{display:grid;grid-template-columns:4.6em 1fr auto;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.line:last-child{border-bottom:1px solid var(--line)}
.who{font-size:14px;color:var(--muted);padding-top:1.1em}
.line.me .who{color:var(--shu);font-weight:700}
.ja{margin:0;font-size:23px;line-height:2.15;word-break:keep-all;overflow-wrap:anywhere}
rt{font-size:.5em;color:var(--muted);letter-spacing:0}
body.no-furi .ja rt, body.no-furi .pat-p rt, body.no-furi .ex rt{visibility:hidden}
.kana{display:none;margin:2px 0 0;color:var(--ai);font-size:16px;font-family:"Zen Old Mincho",serif}
body.show-kana .kana{display:block}
.zh{margin:4px 0 0;font-size:15px;color:var(--muted);transition:filter .2s}
body.hide-zh .zh:not(.peek){filter:blur(6px);cursor:pointer;user-select:none}
.line.speaking .ja{color:var(--ai)}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:10px}
.play:hover{border-color:var(--ai);color:var(--ai)}
.play svg{width:14px;height:14px;fill:currentColor}

.pat{padding:18px 0;border-top:1px solid var(--line)}
.pat:last-child{border-bottom:1px solid var(--line)}
.pat-p{font-size:22px;margin:0;line-height:2}
.pat-zh{margin:0;font-weight:500}
.pat-note{margin:6px 0 0;color:var(--muted);font-size:15px}
.ex{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:var(--ai-soft);border-radius:6px}
.ex .ex-ja{font-size:18px;line-height:2}
.ex .ex-zh{font-size:14px;color:var(--muted)}
.ex .play{margin:0;width:34px;height:34px;flex:none}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 24px}
.v{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.v:hover .v-w{color:var(--ai)}
.v-w{font-size:22px;line-height:1.3}
.v-r{font-size:15px;color:var(--ai);font-family:"Zen Old Mincho",serif}
.v-zh{font-size:14px;color:var(--muted);grid-column:1/-1}
.v-ic{color:var(--muted);font-size:13px}

.done-row{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.done-row .btn.is-done{background:var(--shu-soft);color:var(--shu);border-color:var(--shu)}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;text-align:left;font-size:14px;position:relative}
.tile:hover{border-color:var(--ink)}
.tile .n{font-family:"Zen Old Mincho",serif;color:var(--muted);font-size:13px;min-width:2.6em}
.tile.learned{background:transparent}
.tile.learned::after{content:"済";margin-left:auto;color:var(--shu);border:1.5px solid var(--shu);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.tile.current{border-color:var(--ai);box-shadow:inset 3px 0 0 var(--ai)}
.lib-tools{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
#libSearch{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
#libSearch:focus{outline:2px solid var(--ai);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{opacity:.7;margin-left:4px;font-size:12px}
.empty{color:var(--muted)}
.tile .cat{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

@media (max-width:560px){
  .line{grid-template-columns:1fr auto}
  .who{grid-column:1/-1;padding-top:0}
  .ja{font-size:21px}
  .stage{gap:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .jar.drawn .stick{opacity:1;transform:translateY(-58px)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="jp">旅の日本語</h1>
      <p>200 段旅行會話，每天抽一段，搭配漢字、假名與句型一起學</p>
    </div>
    <div class="tools">
      <span id="progress"></span>
      <button class="icon-btn" id="themeBtn" aria-label="切換深色或淺色">◐</button>
    </div>
  </header>

  <section aria-labelledby="h-draw">
    <h2 id="h-draw">抽卡 <span class="sub jp">今日のおみくじ</span></h2>
    <div class="stage">
      <div class="jar" id="jar">
        <span class="stick" aria-hidden="true"></span>
        <button class="box" id="box" aria-label="搖籤筒抽卡"><span class="box-label jp">おみくじ</span></button>
      </div>
      <div class="slip-area" id="slipArea">
        <p class="hint">點一下籤筒，抽出今天要學的會話。</p>
      </div>
    </div>
    <div class="draw-actions">
      <button class="btn primary" id="drawBtn">抽今天的會話</button>
    </div>
  </section>

  <section id="lesson" hidden>
    <h2>會話 <span class="sub jp">会話</span></h2>
    <div class="lesson-bar" role="group" aria-label="顯示選項">
      <button class="toggle" data-t="furi" aria-pressed="true">振假名</button>
      <button class="toggle" data-t="kana" aria-pressed="false">全平假名</button>
      <button class="toggle" data-t="zh" aria-pressed="true">中文翻譯</button>
      <span class="bar-gap"></span>
      <button class="btn" id="rateBtn">語速：正常</button>
      <button class="btn" id="playAll">播放全部</button>
    </div>
    <div id="dialog"></div>

    <h2>句型分析 <span class="sub jp">文型</span></h2>
    <div id="patterns"></div>

    <h2>重點單字 <span class="sub jp">単語</span></h2>
    <div class="vocab" id="vocab"></div>

    <div class="done-row">
      <button class="btn primary" id="doneBtn">標記為已學會</button>
    </div>
  </section>

  <section aria-labelledby="h-lib">
    <h2 id="h-lib">所有會話 <span class="sub" id="libCount"></span></h2>
    <div class="lib-tools">
      <input type="search" id="libSearch" placeholder="搜尋情境、中文或日文，例如：拉麵、切符" aria-label="搜尋會話">
      <div class="chips" id="chips" role="group" aria-label="依類別篩選"></div>
    </div>
    <div class="lib" id="lib"></div>
    <p class="empty" id="libEmpty" hidden>找不到符合的會話，換個關鍵字或類別試試。</p>
    <p class="foot">學習進度只存在這個瀏覽器裡。發音使用裝置內建的日語語音，若沒有聲音，請在系統設定中加入日語語音。
      <button class="linkish" id="resetBtn">清除學習紀錄</button></p>
  </section>
</div>

lines:[["櫃檯","いらっしゃいませ。","歡迎光臨。"],["我","チェックインをお願{ねが}いします。予約{よやく}したリンです。","我要辦理入住。我是有預約的林。"],["櫃檯","パスポートをお願{ねが}いします。お部屋{へや}は八階{はっかい}です。","麻煩出示護照。您的房間在八樓。"],["我","朝食{ちょうしょく}は何時{なんじ}からですか。","早餐幾點開始？"],["櫃檯","七時{しちじ}から十時{じゅうじ}までです。","七點到十點。"],["我","明日{あした}、チェックアウトの後{あと}で荷物{にもつ}を預{あず}かってもらえますか。","明天退房後，可以幫我寄放行李嗎？"],["櫃檯","はい、かしこまりました。","好的，沒問題。"]],
patterns:[
{p:"〜をお願{ねが}いします",zh:"麻煩～／我要～",note:"旅行萬用句！把想要的東西或服務放在前面就好。",ex:"禁煙{きんえん}の部屋{へや}をお願{ねが}いします。",exzh:"麻煩給我禁菸房。"},
{p:"〜から〜まで",zh:"從～到～",note:"表示時間或地點的起點與終點。",ex:"九時{くじ}から五時{ごじ}までです。",exzh:"從九點到五點。"},
{p:"〜てもらえますか",zh:"可以幫我～嗎？",note:"請對方幫忙做某事，比「〜てください」更委婉。",ex:"タクシーを呼{よ}んでもらえますか。",exzh:"可以幫我叫計程車嗎？"}],
vocab:[["予約","よやく","預約"],["部屋","へや","房間"],["八階","はっかい","八樓"],["朝食","ちょうしょく","早餐"],["荷物","にもつ","行李"],["預かる","あずかる","保管、寄放"]]},

{id:4,cat:"飲食",emoji:"🍱",title:"レストランで注文{ちゅうもん}",zh:"餐廳點餐",scene:"走進一家定食店，不知道點什麼，請店員推薦。",
lines:[["店員","いらっしゃいませ。何名様{なんめいさま}ですか。","歡迎光臨，請問幾位？"],["我","二人{ふたり}です。","兩位。"],["店員","こちらへどうぞ。","這邊請。"],["我","すみません、おすすめは何{なん}ですか。","不好意思，推薦什麼呢？"],["店員","この唐揚{からあ}げ定食{ていしょく}が人気{にんき}ですよ。","這個炸雞定食很受歡迎喔。"],["我","じゃあ、これを二{ふた}つください。それから、生{なま}ビールを一{ひと}つ。","那請給我兩份這個。然後一杯生啤酒。"],["店員","かしこまりました。少々{しょうしょう}お待{ま}ちください。","好的，請稍等。"]],
patterns:[
{p:"何名様{なんめいさま}ですか",zh:"請問幾位？",note:"進餐廳一定會聽到。回答用「一人（ひとり）」「二人（ふたり）」「三人（さんにん）」。",ex:"三人{さんにん}です。",exzh:"三位。"},
{p:"〜をください",zh:"請給我～",note:"點餐、購物最好用的句型。也可以指著菜單說「これをください」。",ex:"お水{みず}をください。",exzh:"請給我水。"},
{p:"おすすめは何{なん}ですか",zh:"推薦什麼？",note:"不知道點什麼時的救星。",ex:"今日{きょう}のおすすめは何{なん}ですか。",exzh:"今天的推薦是什麼？"}],
vocab:[["注文","ちゅうもん","點餐"],["定食","ていしょく","定食、套餐"],["人気","にんき","受歡迎"],["生ビール","なまビール","生啤酒"],["一つ／二つ","ひとつ／ふたつ","一個／兩個"],["少々","しょうしょう","稍微"]]},

{id:5,cat:"飲食",emoji:"💴",title:"お会計{かいけい}",zh:"餐廳結帳",scene:"吃飽了要結帳，想問能不能刷卡。",
lines:[["我","すみません、お会計{かいけい}をお願{ねが}いします。","不好意思，我要結帳。"],["店員","はい、全部{ぜんぶ}で三千二百円{さんぜんにひゃくえん}です。","好的，總共三千兩百日圓。"],["我","カードで払{はら}えますか。","可以刷卡嗎？"],["店員","申{もう}し訳{わけ}ありません、現金{げんきん}のみです。","非常抱歉，只收現金。"],["我","わかりました。じゃあ、現金{げんきん}で。","了解，那就付現。"],["店員","五千円{ごせんえん}お預{あず}かりします。千八百円{せんはっぴゃくえん}のお返{かえ}しです。","收您五千日圓，找您一千八百日圓。"],["我","ごちそうさまでした。","謝謝招待。"]],
patterns:[
{p:"〜で払{はら}えますか",zh:"可以用～付款嗎？",note:"「で」表示手段。「払える」是「払う」的可能形。",ex:"Suicaで払{はら}えますか。",exzh:"可以用 Suica 付款嗎？"},
{p:"〜のみです",zh:"只有～",note:"比「〜だけです」更正式，常見於店家告示。",ex:"現金{げんきん}のみです。",exzh:"僅收現金。"},
{p:"ごちそうさまでした",zh:"謝謝招待",note:"離開餐廳時對店員說，很有禮貌。",ex:"ごちそうさまでした。美味{おい}しかったです。",exzh:"謝謝招待，很好吃。"}],
vocab:[["会計","かいけい","結帳"],["全部で","ぜんぶで","總共"],["払う","はらう","支付"],["現金","げんきん","現金"],["お釣り","おつり","找零"],["申し訳ありません","もうしわけありません","非常抱歉"]]},

{id:6,cat:"交通",emoji:"🗺️",title:"道{みち}を聞{き}く",zh:"問路",scene:"在淺草附近迷路了，向路人問怎麼走。",
lines:[["我","すみません、浅草寺{せんそうじ}へはどう行{い}けばいいですか。","不好意思，請問淺草寺要怎麼去？"],["路人","この道{みち}をまっすぐ行{い}って、二{ふた}つ目{め}の信号{しんごう}を右{みぎ}に曲{ま}がってください。","沿著這條路直走，在第二個紅綠燈右轉。"],["我","歩{ある}いて何分{なんぷん}ぐらいですか。","走路大概幾分鐘？"],["路人","十分{じゅっぷん}ぐらいですね。","大概十分鐘吧。"],["我","ありがとうございます。助{たす}かりました。","謝謝您，幫了大忙。"]],
patterns:[
{p:"〜へはどう行{い}けばいいですか",zh:"～要怎麼去？",note:"「へ」表示方向，當助詞時唸作 e。「行けば」是假定形。",ex:"駅{えき}へはどう行{い}けばいいですか。",exzh:"車站要怎麼走？"},
{p:"〜て、〜てください",zh:"先～，然後請～",note:"用て形把動作串起來，表示依序做。",ex:"左{ひだり}に曲{ま}がって、まっすぐ行{い}ってください。",exzh:"左轉後直走。"},
{p:"〜ぐらい",zh:"大約～",note:"接在數量後表示大概。",ex:"五分{ごふん}ぐらいです。",exzh:"大約五分鐘。"}],
vocab:[["道","みち","道路"],["まっすぐ","まっすぐ","直直地"],["信号","しんごう","紅綠燈"],["右／左","みぎ／ひだり","右／左"],["曲がる","まがる","轉彎"],["歩く","あるく","走路"]]},

{id:7,cat:"購物",emoji:"🏪",title:"コンビニで",zh:"便利商店結帳",scene:"在便利商店買便當，店員連續問了好幾個問題。",
lines:[["店員","いらっしゃいませ。お弁当{べんとう}は温{あたた}めますか。","歡迎光臨。便當要加熱嗎？"],["我","はい、お願{ねが}いします。","好，麻煩了。"],["店員","袋{ふくろ}はご利用{りよう}ですか。","需要袋子嗎？"],["我","いいえ、大丈夫{だいじょうぶ}です。","不用，沒關係。"],["店員","お箸{はし}はおつけしますか。","需要附筷子嗎？"],["我","一膳{いちぜん}お願{ねが}いします。","麻煩給我一雙。"],["我","Suicaで払{はら}います。","我用 Suica 付款。"]],
patterns:[
{p:"〜ますか",zh:"要～嗎？",note:"店員詢問你的意願。回答「はい、お願いします」或「いいえ、大丈夫です」即可。",ex:"レシートはいりますか。",exzh:"需要收據嗎？"},
{p:"いいえ、大丈夫{だいじょうぶ}です",zh:"不用了，謝謝",note:"「大丈夫です」在這裡是委婉拒絕，比直接說「いりません」柔和。",ex:"袋{ふくろ}は大丈夫{だいじょうぶ}です。",exzh:"不用袋子。"},
{p:"〜で払{はら}います",zh:"我用～付款",note:"主動告訴店員付款方式。",ex:"カードで払{はら}います。",exzh:"我刷卡。"}],
vocab:[["弁当","べんとう","便當"],["温める","あたためる","加熱"],["袋","ふくろ","袋子"],["箸","はし","筷子"],["大丈夫","だいじょうぶ","沒問題、不用了"],["利用","りよう","使用"]]},

{id:8,cat:"購物",emoji:"👕",title:"服{ふく}を試着{しちゃく}する",zh:"買衣服試穿",scene:"在服飾店看到喜歡的衣服，想試穿並換尺寸。",
lines:[["我","すみません、これを試着{しちゃく}してもいいですか。","不好意思，這件可以試穿嗎？"],["店員","はい、試着室{しちゃくしつ}はあちらです。","可以，試衣間在那邊。"],["我","もう少{すこ}し大{おお}きいサイズはありますか。","有再大一點的尺寸嗎？"],["店員","少々{しょうしょう}お待{ま}ちください。……こちらはいかがですか。","請稍等……這件如何？"],["我","ちょうどいいです。これにします。","剛剛好。我要這件。"],["店員","免税{めんぜい}の手続{てつづ}きをしますので、パスポートをお願{ねが}いします。","要辦理免稅手續，麻煩出示護照。"]],
patterns:[
{p:"〜てもいいですか",zh:"可以～嗎？",note:"請求許可的基本句型。",ex:"触{さわ}ってもいいですか。",exzh:"可以摸摸看嗎？"},
{p:"もう少{すこ}し〜はありますか",zh:"有再～一點的嗎？",note:"「もう少し」加形容詞，用來要求別的尺寸、顏色或價格。",ex:"もう少{すこ}し安{やす}いのはありますか。",exzh:"有再便宜一點的嗎？"},
{p:"〜にします",zh:"我決定要～",note:"做出選擇時用。",ex:"この色{いろ}にします。",exzh:"我要這個顏色。"}],
vocab:[["試着","しちゃく","試穿"],["試着室","しちゃくしつ","試衣間"],["大きい／小さい","おおきい／ちいさい","大／小"],["免税","めんぜい","免稅"],["手続き","てつづき","手續"],["色","いろ","顏色"]]},

{id:9,cat:"緊急",emoji:"💊",title:"薬局{やっきょく}で",zh:"藥局買藥",scene:"旅途中頭痛又有點發燒，到藥局請藥劑師推薦。",
lines:[["我","すみません、頭{あたま}が痛{いた}いんですが、何{なに}かいい薬{くすり}はありますか。","不好意思，我頭痛，有什麼好的藥嗎？"],["藥劑師","熱{ねつ}はありますか。","有發燒嗎？"],["我","少{すこ}しあります。","有一點。"],["藥劑師","では、この薬{くすり}がいいですよ。一日{いちにち}三回{さんかい}、食後{しょくご}に飲{の}んでください。","那這個藥不錯喔。一天三次，飯後服用。"],["我","一回{いっかい}に何錠{なんじょう}ですか。","一次吃幾顆？"],["藥劑師","二錠{にじょう}です。","兩顆。"],["我","わかりました。ありがとうございます。","了解，謝謝。"]],
patterns:[
{p:"〜が痛{いた}いんですが",zh:"我～痛……",note:"「〜んですが」用來說明狀況並帶出請求，語氣自然。",ex:"お腹{なか}が痛{いた}いんですが。",exzh:"我肚子痛……"},
{p:"何{なに}か〜はありますか",zh:"有什麼～嗎？",note:"「何か」表示「某個東西」，詢問有沒有推薦。",ex:"何{なに}か甘{あま}いものはありますか。",exzh:"有什麼甜的嗎？"},
{p:"〜に飲{の}んでください",zh:"請在～時服用",note:"日文吃藥用「飲む」（喝），不是「食べる」。",ex:"寝{ね}る前{まえ}に飲{の}んでください。",exzh:"請在睡前服用。"}],
vocab:[["頭","あたま","頭"],["痛い","いたい","痛"],["薬","くすり","藥"],["熱","ねつ","發燒"],["食後","しょくご","飯後"],["〜錠","じょう","～顆（藥錠）"]]},

{id:10,cat:"交通",emoji:"🚕",title:"タクシーに乗{の}る",zh:"搭計程車",scene:"行李太多，決定搭計程車到飯店。",
lines:[["司機","どちらまでですか。","請問到哪裡？"],["我","この住所{じゅうしょ}までお願{ねが}いします。","麻煩到這個地址。"],["司機","かしこまりました。","好的。"],["我","どのくらいかかりますか。","大概要多久？"],["司機","二十分{にじゅっぷん}ぐらいです。","大約二十分鐘。"],["我","あ、ここで止{と}めてください。","啊，請在這裡停。"],["司機","二千四百円{にせんよんひゃくえん}です。","兩千四百日圓。"],["我","領収書{りょうしゅうしょ}をください。","請給我收據。"]],
patterns:[
{p:"〜までお願{ねが}いします",zh:"麻煩到～",note:"搭計程車說目的地的標準說法。",ex:"東京駅{とうきょうえき}までお願{ねが}いします。",exzh:"麻煩到東京車站。"},
{p:"どのくらいかかりますか",zh:"要花多久／多少錢？",note:"「かかる」表示花費時間或金錢。",ex:"空港{くうこう}までどのくらいかかりますか。",exzh:"到機場要多久？"},
{p:"〜てください",zh:"請～",note:"動詞て形加ください，是最常用的請求。",ex:"ゆっくり話{はな}してください。",exzh:"請說慢一點。"}],
vocab:[["運転手","うんてんしゅ","司機"],["住所","じゅうしょ","地址"],["かかる","かかる","花費"],["止める","とめる","停下"],["領収書","りょうしゅうしょ","收據"],["近く","ちかく","附近"]]},

{id:11,cat:"觀光",emoji:"🏯",title:"入場券{にゅうじょうけん}を買{か}う",zh:"景點買門票",scene:"來到城堡景點，買票時順便問能不能拍照。",
lines:[["我","大人{おとな}二枚{にまい}ください。","請給我兩張成人票。"],["售票員","二千円{にせんえん}です。","兩千日圓。"],["我","中{なか}で写真{しゃしん}を撮{と}ってもいいですか。","裡面可以拍照嗎？"],["售票員","はい。でも、フラッシュは使{つか}わないでください。","可以，但請不要使用閃光燈。"],["我","何時{なんじ}まで開{あ}いていますか。","開到幾點？"],["售票員","午後{ごご}五時{ごじ}までです。","到下午五點。"]],
patterns:[
{p:"〜を〜枚{まい}ください",zh:"請給我～張～",note:"「枚」用來數扁平的東西，像票、紙、照片。",ex:"子{こ}ども一枚{いちまい}ください。",exzh:"請給我一張兒童票。"},
{p:"〜ないでください",zh:"請不要～",note:"動詞ない形加でください，表示請對方別做。",ex:"ここで食{た}べないでください。",exzh:"請不要在這裡吃東西。"},
{p:"〜ています",zh:"（狀態）～著",note:"「開いています」表示「開著的狀態」。",ex:"今日{きょう}は閉{し}まっています。",exzh:"今天沒開（關著）。"}],
vocab:[["入場券","にゅうじょうけん","門票"],["大人","おとな","成人"],["子ども","こども","兒童"],["〜枚","まい","～張"],["写真","しゃしん","照片"],["撮る","とる","拍（照）"]]},

{id:12,cat:"觀光",emoji:"📷",title:"写真{しゃしん}をお願{ねが}いする",zh:"請人幫忙拍照",scene:"想在景點前拍一張合照，請路人幫忙。",
lines:[["我","すみません、写真{しゃしん}を撮{と}っていただけませんか。","不好意思，可以幫我拍張照嗎？"],["路人","いいですよ。","好啊。"],["我","このボタンを押{お}すだけです。","只要按這個按鈕就好。"],["路人","じゃ、撮{と}りますよ。はい、チーズ！","那我要拍囉，來，笑一個！"],["我","すみません、もう一枚{いちまい}お願{ねが}いします。","不好意思，麻煩再一張。"],["路人","はい、どうぞ。","好，給你。"],["我","ありがとうございました。","謝謝您。"]],
patterns:[
{p:"〜ていただけませんか",zh:"能否請您～？",note:"比「〜てください」更客氣，對陌生人請求幫忙時很好用。",ex:"もう一度{いちど}言{い}っていただけませんか。",exzh:"能否請您再說一次？"},
{p:"〜だけです",zh:"只要～就好",note:"「だけ」表示限定。",ex:"見{み}るだけです。",exzh:"我只是看看。"},
{p:"もう＋數量",zh:"再～",note:"「もう」加數量表示「再」。",ex:"もう一{ひと}つください。",exzh:"請再給我一個。"}],
vocab:[["押す","おす","按"],["撮る","とる","拍攝"],["もう一枚","もういちまい","再一張"],["一度","いちど","一次"],["言う","いう","說"],["通行人","つうこうにん","路人"]]},

{id:13,cat:"住宿",emoji:"♨️",title:"旅館{りょかん}で",zh:"溫泉旅館",scene:"入住溫泉旅館，服務員來房間確認晚餐時間。",
lines:[["服務員","お食事{しょくじ}は何時{なんじ}になさいますか。","晚餐要安排在幾點呢？"],["我","六時半{ろくじはん}でお願{ねが}いします。","麻煩六點半。"],["我","温泉{おんせん}は何時{なんじ}まで入{はい}れますか。","溫泉可以泡到幾點？"],["服務員","夜{よる}十一時{じゅういちじ}までです。朝{あさ}は五時{ごじ}から入{はい}れます。","到晚上十一點。早上五點開始可以泡。"],["我","タオルは持{も}っていったほうがいいですか。","毛巾要自己帶過去比較好嗎？"],["服務員","はい、お部屋{へや}のタオルをお持{も}ちください。","是的，請帶房間裡的毛巾。"]],

(function(){
  const txt = document.getElementById('more').textContent;
  let c = null;
  txt.split('\n').forEach(raw => {
    const l = raw.trim(); if (!l) return;
    const f = l.split('|');
    if (f[0][0] === '@') { c = {id:+f[0].slice(1), cat:f[1], emoji:f[2], title:f[3], zh:f[4], scene:f[5], lines:[], patterns:[], vocab:[]}; DATA.push(c); }
    else if (!c) return;
    else if (f[0] === 'P') c.patterns.push({p:f[1], zh:f[2], note:f[3], ex:f[4], exzh:f[5]});
    else if (f[0] === 'V') c.vocab.push([f[1], f[2], f[3]]);
    else c.lines.push([f[0], f[1], f[2]]);
  });
})();
const CATS = ['交通','住宿','飲食','購物','觀光','緊急','交流'];
const RE = /([\u3005\u3007\u4E00-\u9FFF]+)\{([^}]+)\}/g;
const rb = s => s.replace(RE, '<ruby>$1<rt>$2</rt></ruby>');
const kana = s => s.replace(RE, '$2');
const plain = s => s.replace(RE, '$1');
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const NUM = ['','一','二','三','四','五','六','七','八','九','十'];
const kanjiNum = n => {
  const h = Math.floor(n/100), t = Math.floor(n%100/10), o = n%10;
  return (h ? (h>1?NUM[h]:'') + '百' : '') + (t ? (t>1?NUM[t]:'') + '十' : '') + (o ? NUM[o] : '');
};
const FORTUNES = ['大吉','吉','中吉','小吉','末吉'];
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
const PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z"/></svg>';

let learned = store.get('tj.learned', []);
let today = store.get('tj.today', null);
let current = null, fortune = '吉';
let rate = 1;

/* theme */
const savedTheme = store.get('tj.theme', null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('themeBtn').onclick = () => {
  const isDark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('tj.theme', next);
};

/* speech */
let queueToken = 0;
function speak(text, onstart, onend){
  if (!('speechSynthesis' in window)) { alert('這個瀏覽器不支援語音播放。'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').startsWith('ja'));
  if (v) u.voice = v;
  if (onstart) u.onstart = onstart;
  if (onend) { u.onend = onend; u.onerror = onend; }
  speechSynthesis.speak(u);
}
function say(text){ queueToken++; clearSpeaking(); if ('speechSynthesis' in window) speechSynthesis.cancel(); speak(text); }
function clearSpeaking(){ document.querySelectorAll('.line.speaking').forEach(el => el.classList.remove('speaking')); }
if ('speechSynthesis' in window) speechSynthesis.getVoices();

$('rateBtn').onclick = () => { rate = rate === 1 ? 0.7 : 1; $('rateBtn').textContent = '語速：' + (rate === 1 ? '正常' : '慢速'); };
$('playAll').onclick = () => {
  if (!current) return;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const token = ++queueToken; clearSpeaking();
  const rows = [...document.querySelectorAll('#dialog .line')];
  const card = DATA.find(d => d.id === current);
  let i = 0;
  const next = () => {
    if (token !== queueToken) return;
    clearSpeaking();
    if (i >= card.lines.length) return;
    const idx = i++;
    speak(plain(card.lines[idx][1]), () => rows[idx] && rows[idx].classList.add('speaking'), () => setTimeout(next, 350));
  };
  next();
};

/* toggles */
document.querySelectorAll('.toggle').forEach(b => {
  b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    const t = b.dataset.t;
    if (t === 'furi') document.body.classList.toggle('no-furi', !on);
    if (t === 'kana') document.body.classList.toggle('show-kana', on);
    if (t === 'zh') { document.body.classList.toggle('hide-zh', !on); document.querySelectorAll('.zh.peek').forEach(z => z.classList.remove('peek')); }
  };
});

/* render */
function renderProgress(){ $('progress').textContent = '已學會 ' + learned.length + ' / ' + DATA.length; }

function renderSlip(reveal, justStamped){
  const c = DATA.find(d => d.id === current);
  const done = learned.includes(c.id);
  $('slipArea').innerHTML =
    '<div class="slip jp' + (reveal ? ' reveal' : '') + '">' +
      '<span class="no">第' + kanjiNum(c.id) + '番</span>' +
      '<span class="fortune">' + fortune + '</span>' +
      '<span class="ttl">' + rb(c.title) + '</span>' +
      (done ? '<span class="stamp jp' + (justStamped ? ' pop' : '') + '" aria-label="已學會">済</span>' : '') +
    '</div>' +
    '<div class="slip-info"><div class="emoji" aria-hidden="true">' + c.emoji + '</div><h3>' + c.zh + ' <span class="cat-tag">' + c.cat + '</span></h3><p>' + c.scene + '</p></div>';
}

function renderLesson(){
  const c = DATA.find(d => d.id === current);
  $('dialog').innerHTML = c.lines.map((l, i) =>
    '<div class="line' + (l[0] === '我' ? ' me' : '') + '">' +
      '<div class="who">' + l[0] + '</div>' +
      '<div><p class="ja jp" lang="ja">' + rb(l[1]) + '</p>' +
      '<p class="kana" lang="ja">' + kana(l[1]) + '</p>' +
      '<p class="zh">' + l[2] + '</p></div>' +
      '<button class="play" data-say="' + i + '" aria-label="播放這句">' + PLAY + '</button>' +
    '</div>').join('');
  $('dialog').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(plain(c.lines[+b.dataset.say][1])));
  $('dialog').querySelectorAll('.zh').forEach(z => z.onclick = () => z.classList.toggle('peek'));

  $('patterns').innerHTML = c.patterns.map((p, i) =>
    '<div class="pat">' +
      '<p class="pat-p jp" lang="ja">' + rb(p.p) + '</p>' +
      '<p class="pat-zh">' + p.zh + '</p>' +
      '<p class="pat-note">' + p.note + '</p>' +
      '<div class="ex"><div style="flex:1"><div class="ex-ja jp" lang="ja">' + rb(p.ex) + '</div><div class="ex-zh">' + p.exzh + '</div></div>' +
      '<button class="play" data-ex="' + i + '" aria-label="播放例句">' + PLAY + '</button></div>' +
    '</div>').join('');
  $('patterns').querySelectorAll('[data-ex]').forEach(b => b.onclick = () => say(plain(c.patterns[+b.dataset.ex].ex)));

  $('vocab').innerHTML = c.vocab.map((v, i) =>
    '<button class="v" data-v="' + i + '" aria-label="播放 ' + v[0] + '">' +
      '<span class="v-w jp" lang="ja">' + v[0] + '</span><span class="v-ic">▶</span>' +
      '<span class="v-r" lang="ja">' + v[1] + '</span>' +
      '<span class="v-zh">' + v[2] + '</span>' +
    '</button>').join('');
  $('vocab').querySelectorAll('[data-v]').forEach(b => b.onclick = () => say(c.vocab[+b.dataset.v][1].split('／')[0]));
  updateDone();
}

function updateDone(){
  const done = learned.includes(current);
  $('doneBtn').textContent = done ? '已學會（點此取消）' : '標記為已學會';
  $('doneBtn').classList.toggle('is-done', done);
}

let libCat = '全部', libQ = '';
function renderChips(){
  const opts = ['全部', ...CATS, '未學'];
  $('chips').innerHTML = opts.map(o => {
    const n = o === '全部' ? DATA.length : o === '未學' ? DATA.filter(d => !learned.includes(d.id)).length : DATA.filter(d => d.cat === o).length;
    return '<button class="chip" data-c="' + o + '" aria-pressed="' + (o === libCat) + '">' + o + '<span class="c">' + n + '</span></button>';
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { libCat = b.dataset.c; renderLib(); });
}
function matches(d){
  if (libCat === '未學' && learned.includes(d.id)) return false;
  if (libCat !== '全部' && libCat !== '未學' && d.cat !== libCat) return false;
  if (!libQ) return true;
  const hay = [d.zh, d.scene, plain(d.title), kana(d.title), ...d.lines.map(l => plain(l[1]) + kana(l[1]) + l[2]), ...d.vocab.map(v => v.join(''))].join(' ');
  return hay.toLowerCase().includes(libQ.toLowerCase());
}
function renderLib(){
  renderChips();
  const list = DATA.filter(matches);
  $('lib').innerHTML = list.map(d =>
    '<button class="tile' + (learned.includes(d.id) ? ' learned' : '') + (d.id === current ? ' current' : '') + '" data-id="' + d.id + '">' +
      '<span class="n">第' + kanjiNum(d.id) + '番</span><span>' + d.emoji + ' ' + d.zh + '</span></button>').join('');
  $('libEmpty').hidden = list.length > 0;
  $('libCount').textContent = '顯示 ' + list.length + ' 則';
  $('lib').querySelectorAll('.tile').forEach(t => t.onclick = () => {
    fortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
    show(+t.dataset.id, true);
    $('lesson').scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth'});
  });
  renderProgress();
}
$('libSearch').addEventListener('input', e => { libQ = e.target.value.trim(); renderLib(); });

function show(id, reveal){
  queueToken++; if ('speechSynthesis' in window) speechSynthesis.cancel();
  current = id;
  $('jar').classList.add('drawn');
  renderSlip(reveal);
  renderLesson();
  $('lesson').hidden = false;
  renderLib();
}

function draw(){
  let pool = DATA.filter(d => !learned.includes(d.id) && d.id !== current);
  if (!pool.length) pool = DATA.filter(d => d.id !== current);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  fortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
  const jar = $('jar');
  jar.classList.remove('drawn', 'shaking'); void jar.offsetWidth;
  const finish = () => {
    jar.classList.remove('shaking');
    today = {date: todayStr(), id: pick.id, fortune};
    store.set('tj.today', today);
    show(pick.id, true);
    $('drawBtn').textContent = '換一張';
  };
  if (reduceMotion) finish();
  else { jar.classList.add('shaking'); setTimeout(finish, 780); }
}
$('drawBtn').onclick = draw;
$('box').onclick = draw;

$('doneBtn').onclick = () => {
  const i = learned.indexOf(current);
  let stamped = false;
  if (i >= 0) learned.splice(i, 1); else { learned.push(current); stamped = true; }
  store.set('tj.learned', learned);
  renderSlip(false, stamped); updateDone(); renderLib();
};
$('resetBtn').onclick = () => {
  if (!confirm('確定要清除所有學習紀錄嗎？')) return;
  learned = []; store.set('tj.learned', learned);
  if (current) { renderSlip(false); updateDone(); }
  renderLib();
};

/* init */
renderLib();
if (today && today.date === todayStr() && DATA.some(d => d.id === today.id)) {
  fortune = today.fortune || '吉';
  show(today.id, false);
  $('drawBtn').textContent = '換一張';
}
</script>
</body>
</html>
